version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-management-system-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8000}
      APP_PORT: ${APP_PORT:-8000}
      JWT_KEY: ${JWT_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DB_CONNECTION: ${DB_CONNECTION:-postgres}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_URL: ${DB_URL:-postgres://postgres:postgres@postgres:5432/postgres}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
            sh -c "npm run migrate &&
              npm run seed &&
             node index.js"

  postgres:
    image: postgres:16-alpine
    container_name: employee-management-system-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
